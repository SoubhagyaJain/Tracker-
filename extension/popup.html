<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>AI Career OS Learning</title><link rel="stylesheet" href="popup.css"></head>
<body>
<header><h1>AI Career OS Learning</h1><p id="status" role="status">Opening companion…</p></header>
<details open><summary>Local dashboard</summary>
<label>Dashboard origin<input id="origin" value="http://127.0.0.1:3000" type="url"></label>
<div class="buttons"><button id="open" type="button">Open dashboard</button><button id="connect" type="button">Test connection</button></div>
</details>
<details open><summary>Course and progress</summary>
<form id="course">
<button id="capture" type="button">Use current Udemy URL</button>
<label>Course URL<input id="url" type="url" required></label>
<label>Course title<input id="title" required maxlength="250"></label>
<div class="fields">
<label>Completed lectures<input id="completed" type="number" min="0" max="10000"></label>
<label>Total lectures<input id="total" type="number" min="0" max="10000"></label>
<label>Percent complete<input id="percent" type="number" min="0" max="100"></label>
</div>
<label>Roadmap task<select id="task"><option value="">Use course mapping</option></select></label>
<label>Study activity<select id="mode"><option>Implementation</option><option>Video</option><option>Revision</option><option>Practice &amp; assessment</option></select></label>
<h2>Study timer</h2>
<p id="elapsed" aria-label="Elapsed study time">0:00</p>
<div class="buttons"><button id="start" type="button">Start</button><button id="pause" type="button">Pause</button><button id="stop" type="button">Stop</button></div>
<p id="stopped"></p>
<label>Measured video minutes<input id="video" type="number" min="0" max="1440" value="0"></label>
<button type="submit">Queue for review</button>
</form>
</details>
<section><h2>Review queue</h2><p>Review each course and session before sending it to the connected dashboard.</p>
<ul id="queue"></ul><button id="send" type="button">Send reviewed records</button></section>
<script src="popup.js"></script>
</body>
</html>
